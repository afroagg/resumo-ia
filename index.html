<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumoIA - Gerador de Resumos e Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ResumoIA</h1>
  <p>Cole um texto, gere um resumo e teste seus conhecimentos com um quiz gerado por IA.</p>

  <textarea id="textoInput" placeholder="Cole aqui o texto que deseja resumir..."></textarea>
  <button id="btnGerar">Gerar Resumo e Quiz</button>

  <div id="resultado"></div>

  <script src="script.js"></script>
</body>
</html>
